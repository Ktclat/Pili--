name: Android validation build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install isolated Flutter SDK
        run: git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git .tools/flutter
      - name: Resolve dependencies and apply upstream patches
        shell: pwsh
        run: ./scripts/prepare_android.ps1
      - name: Analyze and run retained regression tests
        env:
          PUB_CACHE: ${{ github.workspace }}/.tools/pub-cache
        run: |
          .tools/flutter/bin/flutter analyze --no-pub --no-fatal-infos
          .tools/flutter/bin/flutter test --no-pub
      - name: Build test-signed APKs
        env:
          PUB_CACHE: ${{ github.workspace }}/.tools/pub-cache
        run: .tools/flutter/bin/flutter build apk --release --split-per-abi --no-pub --dart-define=pili.name=0.1.0 --dart-define=pili.hash=${{ github.sha }} --dart-define=pili.time=$(date +%s)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Pili--Android-test-signed
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
