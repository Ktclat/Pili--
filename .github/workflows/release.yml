name: Android test prerelease

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android validation build run on main
        required: true
        type: string
      tag:
        description: Prerelease tag matching the APK version
        required: true
        default: v0.5.0-beta.1
        type: string

permissions:
  contents: read

concurrency:
  group: android-prerelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Ktclat/Pili--' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0"'
      - name: Verify CI packages and publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/publish_android_prerelease.py --run-id "$BUILD_RUN_ID" --tag "$RELEASE_TAG"
