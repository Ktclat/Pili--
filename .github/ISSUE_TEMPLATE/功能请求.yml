name: 功能请求
description: 提出适合 Pili-- 的功能或体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Pili-- 是个人兴趣项目，欢迎从真实使用场景提出建议。
        功能取舍和实现时间由维护精力决定；提交请求不代表已经承诺开发。
        请在本仓库讨论本项目的需求，避免把独立改动的维护压力转给上游。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索 [Pili-- 历史 Issues](https://github.com/Ktclat/Pili--/issues?q=is%3Aissue)，并检查现有设置或文档。
          required: true
        - label: 该需求针对 Pili--，描述和附件不包含账号凭据或个人敏感信息。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 先描述你想解决的问题、使用频率，以及当前操作哪里不方便。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 描述期望的操作流程和结果；可以用示例帮助理解。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否可以用现有设置、其他操作流程或更小的改动解决？

  - type: textarea
    id: scope
    attributes:
      label: 环境、依赖与参考
      description: 说明使用版本、设备或平台；如涉及账号权限、新服务、后台任务或其他项目，请附相关说明和来源链接。

  - type: checkboxes
    id: participation
    attributes:
      label: 参与方式（可选）
      options:
        - label: 我愿意补充复现或使用场景。
        - label: 我愿意测试相关开发版本。
        - label: 我愿意尝试提交实现或文档。
