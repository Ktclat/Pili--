name: 功能请求
description: 描述希望解决的问题，以及期望的使用方式。
labels: [enhancement]
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [本仓库已有请求](https://github.com/Ktclat/Pili--/issues?q=is%3Aissue) 与 [后续计划](https://github.com/Ktclat/Pili--/blob/main/docs/ROADMAP.md)。
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 你在什么场景中遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述用户如何使用这项功能，以及期望的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考（可选）
      description: 当前的处理方式、相关功能、示例或链接。
