name: Bug 反馈
description: 报告 Pili-- 的可复现问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进 Pili--。这是基于 PiliPlus 独立维护的个人兴趣项目，当前主要验证 Android。
        请在本仓库反馈 Pili-- 的问题；安全漏洞请先阅读 [安全说明](https://github.com/Ktclat/Pili--/blob/main/SECURITY.md)。
        不要上传 Cookie、access_key、登录二维码、账号导出文件或订单个人信息。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索 [Pili-- 历史 Issues](https://github.com/Ktclat/Pili--/issues?q=is%3Aissue)，未发现相同问题，或会在下文关联相关讨论。
          required: true
        - label: 这是 Pili-- 的使用问题，附件与日志已移除个人信息和登录凭据。
          required: true

  - type: input
    id: version
    attributes:
      label: 版本与提交号
      description: 在“设置 → 关于”查看；若提交号显示 N/A，请提供下载时对应的提交或 Actions 运行链接。
      placeholder: "例如：0.1.0+1，提交号；或 N/A + 构建链接"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 安装来源
      options:
        - 本仓库 Releases
        - 本仓库 Actions 构建附件
        - 自行构建（请在环境中说明本地修改）
        - 其他来源（请在环境中说明）
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 设备与环境
      description: 提供设备型号、系统版本；网页问题附系统 WebView 版本，扫码问题说明相机权限。其他平台请明确注明。
      placeholder: |
        设备 / 模拟器：
        系统版本：
        WebView 版本（如相关）：
        本地修改或其他安装来源（如有）：
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出从启动开始的最短步骤、发生频率；涉及共存时注明两个客户端的版本及触发入口。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: troubleshooting
    attributes:
      label: 已尝试的排查
      description: 可写网络、账号、权限、设置或其他版本的对照结果；无法确认的部分直接注明，无需先排除所有原因。

  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 如有“设置 → 关于 → 错误日志”，仅提供与问题有关的片段；检查并移除 Cookie、token、个人路径等敏感内容。
      render: text

  - type: textarea
    id: attachments
    attributes:
      label: 截图、录屏与补充信息
      description: 可提供已脱敏的截图、录屏、公开 BV / av 标识，以及相关 Issue 或 Actions 运行链接。
